<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Asteroids</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    canvas {
      display: block;
      border: 1px solid #222;
    }
    #skinbar {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 12px;
      font-family: monospace;
    }
    #skinbar button {
      background: #000;
      color: #fff;
      border: 1px solid #333;
      padding: 6px 12px;
      cursor: pointer;
      font-family: monospace;
      font-size: 13px;
    }
    #skinbar button:hover { border-color: #fff; }
    #skinbar button.active { border-color: #fff; background: #222; }
  </style>
</head>
<body>
  <canvas id="canvas" width="800" height="600"></canvas>
  <div id="skinbar">
    <button data-skin="classic">CLÁSICA</button>
    <button data-skin="viper">VÍBORA</button>
    <button data-skin="javelin">JABALINA</button>
    <button data-skin="phoenix">FÉNIX</button>
    <button data-skin="titan">TITÁN</button>
  </div>
  <script src="game.js"></script>
</body>
</html>
